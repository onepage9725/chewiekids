<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>付款结果 | Chewie Kids</title>
    <link rel="icon" type="image/png" href="ckg logo.png" />
    <style>
      :root {
        --cream: #f8f1e7;
        --warm-apricot: #f1dfca;
        --deep-brown: #38251c;
        --chewie-red: #e94b35;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #fff7ea 0%, var(--cream) 50%, var(--warm-apricot) 100%);
        color: var(--deep-brown);
        font-family: "Noto Serif SC", serif;
      }

      .status-card {
        width: min(640px, 92vw);
        background: #fff;
        border-radius: 22px;
        border: 1px solid rgba(201, 154, 82, 0.35);
        padding: 1.2rem;
        box-shadow: 0 18px 36px rgba(56, 37, 28, 0.12);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 2.8vw, 2.2rem);
      }

      .status-text {
        margin-top: 0.55rem;
        font-size: 1.05rem;
      }

      .status-ok {
        color: #1d7044;
      }

      .status-fail {
        color: var(--chewie-red);
      }

      .meta {
        margin-top: 0.9rem;
        padding: 0.8rem;
        border-radius: 12px;
        background: #fff7ee;
      }

      .meta p {
        margin: 0.3rem 0;
      }

      .actions {
        margin-top: 1rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
      }

      .btn {
        border: 0;
        text-decoration: none;
        border-radius: 999px;
        padding: 0.7rem 1rem;
        font-weight: 700;
      }

      .btn-primary {
        background: var(--chewie-red);
        color: #fff;
      }

      .btn-secondary {
        background: #efe2d2;
        color: var(--deep-brown);
      }
    </style>
  </head>
  <body>
    <section class="status-card">
      <h1 id="statusTitle">正在确认付款...</h1>
      <p class="status-text" id="statusText">请稍候，系统正在验证支付结果。</p>

      <div class="meta" id="statusMeta" hidden>
        <p id="billIdLine"></p>
        <p id="paidAtLine"></p>
      </div>

      <div class="actions">
        <a class="btn btn-primary" href="index.html#packages">继续选购</a>
        <a class="btn btn-secondary" href="index.html#contact">联系客服</a>
      </div>
    </section>

    <script>
      const titleEl = document.getElementById('statusTitle');
      const textEl = document.getElementById('statusText');
      const metaEl = document.getElementById('statusMeta');
      const billIdLineEl = document.getElementById('billIdLine');
      const paidAtLineEl = document.getElementById('paidAtLine');

      async function checkStatus() {
        try {
          const query = window.location.search || '';
          if (!query) {
            titleEl.textContent = '未检测到付款信息';
            textEl.textContent = '若你刚完成付款，请返回订单重新尝试。';
            textEl.className = 'status-text status-fail';
            return;
          }

          const response = await fetch(`/api/billplz/verify-redirect${query}`);
          const result = await response.json();

          if (!response.ok || !result.valid) {
            titleEl.textContent = '付款状态无法验证';
            textEl.textContent = '系统无法确认此次付款，请截图后联系客服务查询。';
            textEl.className = 'status-text status-fail';
            return;
          }

          const paid = String(result.paid).toLowerCase() === 'true';
          if (paid) {
            titleEl.textContent = '付款成功';
            textEl.textContent = '谢谢你，订单已成功付款，我们会尽快安排处理。';
            textEl.className = 'status-text status-ok';
          } else {
            titleEl.textContent = '付款未完成';
            textEl.textContent = '你可以回到页面重新发起付款，或联系客服务协助。';
            textEl.className = 'status-text status-fail';
          }

          metaEl.hidden = false;
          billIdLineEl.textContent = `Bill ID: ${result.billId || '-'}`;
          paidAtLineEl.textContent = `Paid At: ${result.paidAt || '-'}`;
        } catch (error) {
          titleEl.textContent = '发生错误';
          textEl.textContent = '系统暂时无法确认付款状态，请稍后再试。';
          textEl.className = 'status-text status-fail';
        }
      }

      checkStatus();
    </script>
  </body>
</html>
